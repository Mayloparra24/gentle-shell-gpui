name: Release

# Push a `v<version>` tag matching `[workspace.package] version` to publish a
# GitHub release. `workflow_dispatch` is a dry run: it builds and packages
# everything (incl. SHA256SUMS) as workflow artifacts but publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (defaults to, and must equal, the workspace version)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          workspace="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          if [[ -z "$workspace" ]]; then
            echo "::error::no [workspace.package] version in Cargo.toml"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$workspace" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match workspace version $workspace (expected v$workspace)"
              exit 1
            fi
          elif [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" != "$workspace" ]]; then
            echo "::error::input version $INPUT_VERSION does not match workspace version $workspace"
            exit 1
          fi
          echo "version=$workspace" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is no longer offered; macos-latest is GitHub's Apple silicon image.
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel is cross-compiled on the (much faster) Apple silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Tag runs can't read another tag's cache, only main's: cache-warm.yml
      # fills this key on main whenever dependencies change, and tags reuse it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist-${{ matrix.target }}
          save-if: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        # GitHub's Ubuntu runners can stall in apt (man-db triggers, slow
        # mirrors): no man pages, no recommends, retried downloads, capped.
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: packaging/macos/bundle.sh "${{ matrix.target }}" "$VERSION"
      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: packaging/linux/package.sh "${{ matrix.target }}" "$VERSION"
      - name: Package Windows zip and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --profile dist --locked -p gentle-shell-gpui --target "${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "target/${{ matrix.target }}/dist/gentle-shell-gpui.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          # The zip is what the in-app updater downloads.
          Compress-Archive -Force -Path $exe `
            -DestinationPath "dist/gentle-shell-gpui-$env:VERSION-windows-x86_64.zip"
          # The installer is what people download (per-user, no admin).
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:VERSION" `
            "/DSourceExe=$((Resolve-Path $exe).Path)" `
            "/DOutputDir=$((Resolve-Path dist).Path)" `
            "/DIconFile=$((Resolve-Path packaging/icons/icon.ico).Path)" `
            packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: |
            dist/gentle-shell-gpui-${{ env.VERSION }}-*.zip
            dist/gentle-shell-gpui-${{ env.VERSION }}-*.dmg
            dist/gentle-shell-gpui-${{ env.VERSION }}-*.tar.gz
            dist/gentle-shell-gpui-${{ env.VERSION }}-*-setup.exe
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          expected=(
            "gentle-shell-gpui-$VERSION-macos-aarch64.zip"
            "gentle-shell-gpui-$VERSION-macos-aarch64.dmg"
            "gentle-shell-gpui-$VERSION-macos-x86_64.zip"
            "gentle-shell-gpui-$VERSION-macos-x86_64.dmg"
            "gentle-shell-gpui-$VERSION-windows-x86_64.zip"
            "gentle-shell-gpui-$VERSION-windows-x86_64-setup.exe"
            "gentle-shell-gpui-$VERSION-linux-x86_64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            [[ -f "$asset" ]] || { echo "::error::missing $asset"; exit 1; }
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Upload dry-run bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Gentle Shell $VERSION" \
            --generate-notes \
            "${flags[@]}"
