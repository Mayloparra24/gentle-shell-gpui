name: CI

# Tests and lints only. Release builds, packaging and assets belong to
# release.yml (on `v*` tags), so CI never repeats that work.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "packaging/icons/**"]
  pull_request:
    paths-ignore: ["**.md", "packaging/icons/**"]

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        # GitHub's Ubuntu runners can stall in apt (man-db triggers, slow
        # mirrors): no man pages, no recommends, retried downloads, capped.
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
