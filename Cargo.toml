[workspace]
resolver = "2"
members = ["crates/pi-rpc", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Shipped builds: whole-program optimization and no debug symbols. Thin LTO
# keeps link time reasonable in CI while still pruning across crates.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
