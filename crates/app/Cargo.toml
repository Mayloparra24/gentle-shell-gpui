[package]
name = "gentle-shell-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gentle-shell-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
pi-rpc = { path = "../pi-rpc" }
gpui-kit = { version = "0.9.0", features = ["syntect"] }
smol = "2"
dirs = "7"
regex = "1"
sha2 = "0.10"
alacritty_terminal = "0.26"
ignore = "0.4"
ureq = "3"
trash = "5"
# Self-update: release archives (macOS/Windows zip, Linux tar.gz).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"

# The X11 window icon (GPUI's `WindowOptions::icon`).
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Embeds the exe icon and version info (see build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
